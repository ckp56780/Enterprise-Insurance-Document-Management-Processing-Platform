spring.application.name=ocr-service

server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ocr_db
spring.datasource.username=root
spring.datasource.password=chandan

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=ocr-group

#bewlow this properties old record will not fetch it will fetch only the current record
spring.kafka.consumer.auto-offset-reset=latest


spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*